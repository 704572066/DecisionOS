services:
  backend:
    environment:
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-30}
      LLM_JSON_MODE: ${LLM_JSON_MODE:-false}
      REMINDER_TEMPERATURE: ${REMINDER_TEMPERATURE:-0.1}
      REMINDER_RETRIEVAL_TOP_K: ${REMINDER_RETRIEVAL_TOP_K:-8}
      REMINDER_EVIDENCE_TOP_K: ${REMINDER_EVIDENCE_TOP_K:-5}
