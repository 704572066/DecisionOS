services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - decisionos_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [internal]

  backend:
    build: ./src/backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      CORS_ORIGINS: ${PUBLIC_ORIGIN}
      ASR_PROVIDER: ${ASR_PROVIDER:-browser}
      ASR_LANGUAGE: ${ASR_LANGUAGE:-zh-CN}
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY:-}
      DEEPGRAM_MODEL: ${DEEPGRAM_MODEL:-nova-3}
      DEEPGRAM_ENDPOINTING_MS: ${DEEPGRAM_ENDPOINTING_MS:-300}
      REMINDER_MIN_CHARS: ${REMINDER_MIN_CHARS:-30}
      REMINDER_COOLDOWN_SECONDS: ${REMINDER_COOLDOWN_SECONDS:-3}
      APP_NAME: ${APP_NAME:-DecisionOS Demo API}
      APP_ENVIRONMENT: ${APP_ENVIRONMENT:-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    expose: ["8000"]
    depends_on:
      db:
        condition: service_healthy
    networks: [internal]

  frontend:
    build:
      context: ./src/frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_BASE_URL: /api
        VITE_WS_BASE_URL: ""
    restart: unless-stopped
    expose: ["80"]
    depends_on: [backend]
    networks: [internal]

  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./deployment/nginx/decisionos.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [frontend, backend]
    networks: [internal]

volumes:
  decisionos_db:

networks:
  internal:
